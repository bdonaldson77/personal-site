  - title: Projects # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: top-middle
        title: The Bakery
        link: https://github.com/bdonaldson77/rpi-k8s-bakery
        link_text: GitHub Kubernetes Configs
        additional_links:
          - title:  Ansible Playbooks for node configuration
            icon: fab fa-github
            url: https://github.com/bdonaldson77/rpi-ansible-bakery
          # - title:  Github page for project (eg. bdonaldson77/rpi-docker-plex)
          #   icon: fab fa-github
          #   url: Link to project (eg. sproogen.github.io/modern-resume-theme)
        quote: >
          Private Raspberry Pi-based kubernetes cluster for running my home lab.
        description: | # this will include new lines to allow paragraphs
          ![The Bakery](images/TheBakery.jpg "The Bakery")
          A 6U network rack that makes up my home lab, consisting of a Unifi Dream Machine, TP-Link POE switch, four Raspberry Pi 4Bs, and a ThinkCentre Tiny. 

          The Raspberry Pis and ThinkCentre make up a microk8s Kubernetes cluster that runs all my private cloud services. The web services are fronted by CloudFlare for SSL and caching, as well as simple bot-blocking.

          There is a 6-bay NAS on a shelf underneath the rack serving as an NFS server to host persistent storage for the running services as well.

  - title: Experience # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: Electronic Arts
        link: ea.com
        # link_text: ea.com
        sub_title: Software Engineer
        caption: June 2017 - Present
        quote: >
          We Exist to Inspire the World to Play.
        description: | # this will include new lines to allow paragraphs
            As a member of the Troy team of the Game Production Solutions group, I work on tools and technology for build and release teams across the Creative Technologies group.

            Some of my achievements in this role include:
            - Designing and implementing a build-readiness initiative to accelerate build machine deployment by pre-syncing source code and assets to disks that are independently cloned and attached to new machines using accelerated deduplicated cloning. Reduced deployment and sync times by up to 80% while reducing storage use.
            - Developing and internally-open-sourcing a secret-syncing tool to propagate service account passwords to secrets managers after rotation. Reduced downtime from stale secrets locking out automation signficantly for many operations teams across the company.
            - Optimizing slow, unreliable Terraform deployment pipelines with a batching system to chunk deployments up. Reduced IaC toil and management of infrastcture changes significantly, saving DevOps engineers time babysitting pipelines.

            As a member of the Infrastructure Engineering team for the Development and Release Engineering group (DRE IE), I designed and implemented products and services for the CI/CD side of game development.

            Responsibilities and accomplishments in this role included:
            - Implementing a hardware-agnostic approach to cut down machine deployment times from dozens of hours to dozens of minutes
            - Designing, implementing, and evangelizing DRE's use of HashiCorp Vault as a modern secrets storage solution
            - Assuming point-of-contact roles and responsibilities for working with many of EA's central teams (e.g. EA Security, EA IT)
      - layout: left
        title: Core Information Technologies
        link: coreit.ca
        # link_text: coreit.ca
        sub_title: Network Engineer
        caption: April 2014 - June 2017
        quote: >
          Core IT is a Managed Service Provider for companies in the Metro Vancouver area, focused largely on the film and television and natural resources industries.
        description: | # this will include new lines to allow paragraphs
            As a Network Engineer at Core IT, I provided T2 and T3 support for many local and international customers ranging from a handful of employees to hundreds.
            
            While I started out in a help desk role, I was quickly promoted to provide more technical support for servers and networks for the larger clients. I planned and installed server racks, built networks out from the router down to the workstations, and provided on-site support for employees and equipment as required.  

  - title: Education # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: British Columbia Institute of Technology
        caption: 2012 - 2015
        sub_title: Diploma in Computer Information Technology
        quote: >
          BCIT is the largest Computing and IT education provider in Western Canada. The School of Computing provides a comprehensive education in computer and information systems across a breadth of areas of knowledge.
        description: | # this will include new lines to allow paragraphs
          While at BCIT, I learned the fundamentals of IT systems and management. Over the course of my schooling, I worked on several projects both alone and in a group to do things like stand up a personal Exchange server from scratch on the Azure cloud.

          During my second year, I was admitted into the Co-op work education program and spent 8 months working at a Managed Service Provider as a Network Engineer, and returned to complete my diploma before joining my Co-op placement company full-time after graduation. 

