# About Section
# about_title: About Me
about_profile_image: images/Mustache.png
about_content: | # this will include new lines to allow paragraphs
  Hello, I'm Ben. I'm a infrastructure platform engineer in the games industry. While I came from the Ops side of DevOps, my focus has expanded from hardware and infrastructure to include security, automation, software development and system design.
  
  I am most skilled in: <mark>Infrastructure as Code</mark> and <mark>Continuous Integration</mark>.
  My regular tools of the trade include:
  - Hashicorp tooling such as <mark>Packer</mark>, <mark>Terraform</mark>, <mark>Vault</mark>, and Vagrant
  - Configuration management such as <mark>Chef</mark> and <mark>Ansible</mark>
  - CI/CD tools like <mark>Jenkins</mark>, <mark>GitLab CI</mark>, GitHub Actions, Azure DevOps, and CircleCI
  - Programming and scripting, primarily in <mark>Golang</mark> and <mark>PowerShell</mark>. Familiarity with Python and Ruby.
  - Virtualization of VMs and containers on-prem and in the cloud using <mark>Azure</mark> and <mark>vSphere</mark>, and <mark>Kubernetes</mark> and <mark>Docker swarm</mark>

  When I'm not busy with work or family, I also do occasional consultation for smaller projects and tinker with my home network for fun.

